# Type-II kinase inhibitors as a class sit at the greasy end of drug-like space:
# vemurafenib, the approved BRAF(V600E) drug, has logP 5.54, over the global
# max_logp of 5.0. At the global bound the fuzzer silently rejects that whole
# chemical class at the preparation step, before docking. This override admits
# it; the oracle's ligand-efficiency tier is what keeps the extra lipophilicity
# honest. (This is a chemical-space bound, not a known-inhibitor dependency --
# no molecule is seeded or scored against vemurafenib.)
molecules:
  max_logp: 6.0
