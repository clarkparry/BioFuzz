# BioFuzz global configuration.
#
# Every value here is a default. A target may override any key in the `docking`,
# `oracle`, `triage` and `molecules` sections from its own
# targets/<name>/config.yaml; sections are merged key by key, so a target
# restates only what it changes. See docs/adding_targets.md.

docking:
  # Search effort per dock. A single dock at low exhaustiveness is noisy enough
  # to manufacture hits: re-docking the same molecule can move its score by more
  # than a kcal/mol, which is enough to cross the gate in either direction.
  # 8 in the loop, 16 when triage re-docks to confirm.
  exhaustiveness_fuzz: 8
  exhaustiveness_confirm: 16
  # Per-dock wall-clock ceiling, seconds. Comfortable for cnn_model_fuzz: fast.
  # gnina's full model ensemble is far slower on CPU (of the order of a minute
  # and a half per dock on an idle machine), so raise this if you set
  # cnn_model_fuzz to null.
  timeout_seconds: 300
  # CNN model for gnina's pose/affinity scoring pass. "fast" uses a single
  # lightweight model, several times quicker on CPU. null omits --cnn entirely,
  # falling back to gnina's default full ensemble: slower, more accurate.
  cnn_model_fuzz: fast
  cnn_model_confirm: null
  num_modes: 3
  # Docking backend, resolved by name through biofuzz.docker.get_backend.
  # gnina is the only bundled implementation.
  engine: gnina

oracle:
  # A single reference-free affinity gate, inherited by every target. It is
  # deliberately NOT derived from any known inhibitor: BioFuzz is meant to find
  # binders for a protein you have no drug for, so a gate anchored to a drug you
  # already have would defeat the premise.
  #
  # The cost of that choice is that one absolute cutoff cannot suit every
  # target: it is loose on tight-binding sites and strict on weak ones. Of the
  # five bundled reference drugs, three clear -9.0 and two do not (see
  # docs/architecture.md). The reference-free quality tiers below are the
  # sharper discriminators; for a per-target notion of "good", rank hits in
  # triage rather than tuning this number to a specific molecule.
  affinity_threshold: -9.0
  # Intramolecular (strain) energy ceiling, kcal/mol, read from gnina's
  # "intramol" table column.
  strain_threshold: 3.5

  # How vina's empirical score and gnina's CNN prediction combine into the one
  # number the oracle gates on. See biofuzz/oracle/scoring.py.
  #   vina      -- empirical score only
  #   cnn       -- CNN prediction only (converted pKd -> kcal/mol)
  #   consensus -- the weaker of the two; a molecule must convince both
  # consensus is the default because either function alone produces false
  # positives that the other rejects.
  scoring_policy: consensus

  # Minimum ligand efficiency, kcal/mol per heavy atom. Docking scores grow with
  # molecular size, so an affinity-only gate selects for large greasy molecules.
  # Set to null to disable.
  #
  # 0.22, not the textbook 0.3: measured through this pipeline the five bundled
  # reference drugs span LE 0.25 to 0.38, and a 0.3 floor would reject three of
  # them. This is a fixed drug-likeness default, reference-free at runtime -- it
  # does not consult any known inhibitor of the target being fuzzed.
  min_ligand_efficiency: 0.22

  # Minimum gnina CNN pose confidence, 0-1: does the network believe this is a
  # real binding mode? Set to null to disable. The five reference drugs measure
  # 0.60-0.98 here, so 0.4 admits all of them with room to spare.
  min_cnn_pose_score: 0.4

  # Optional: reject when vina and the CNN disagree by more than this many
  # kcal/mol. null disables the tier, since the consensus policy already
  # handles the common case.
  max_score_disagreement: null

  # Essential-residue tier: does the pose engage the part of the pocket a real
  # binder must touch? The scalar tiers above say how *tightly* a pose scores;
  # this is the only one that checks *where* it binds, catching a well-scored
  # pose that sits in the wrong sub-pocket. The essential set is derived from
  # the protein alone -- receptor burial and polar character, blended with
  # P2Rank ligandability at prep time, and refined at runtime by which residues
  # confident seed poses converge on. It never consults a known inhibitor. See
  # biofuzz/protein/essential.py and docs/architecture.md.
  #
  # Minimum essential residues a pose must contact. Deliberately tolerant: 1
  # asks only that the pose reaches the anchor at all. null disables the tier.
  # The tier also self-disables per target when no trustworthy essential set can
  # be formed (no structure, empty pocket), skipping rather than rejecting on
  # noise.
  min_essential_contacts: 1
  # How many top-ranked pocket residues form the structure-derived static set,
  # when a target's config does not pin its own pocket.essential_residue_ids.
  essential_static_count: 4
  # Emergent (self-calibrating) half: a pocket residue joins the set once this
  # fraction of confident seed poses have contacted it, but only after at least
  # essential_emergent_min_poses such poses exist, and only poses with CNN
  # confidence >= essential_emergent_min_pose_score get a vote.
  essential_emergent_fraction: 0.6
  essential_emergent_min_poses: 3
  essential_emergent_min_pose_score: 0.6
  # Ceiling on the gated set, so the tolerant "engage >= 1" gate stays
  # selective.
  essential_max_active: 6

# Property bounds for generated chemistry, applied at molecule preparation, so
# anything outside them is dropped before docking.
#
# OVERRIDE THESE PER TARGET whenever the target's known drugs fall outside them.
# Viable chemical space is a property of the target, not a global constant: this
# envelope excludes indinavir at 614 Da, the reference drug for hiv_protease, so
# that target sets its own bounds. Excluding a target's own drug class means no
# campaign against it can find anything resembling what works.
#
# The oracle's min_ligand_efficiency, not a blanket MW cap, is what keeps size
# honest: it asks what the extra atoms are buying.
molecules:
  max_mw: 550
  max_logp: 5.0
  max_rot_bonds: 10
  mutations_per_entry: 20

corpus:
  max_size: 50000
  priority_new_bit_weight: 10.0
  priority_affinity_weight: 1.0
  priority_reuse_penalty: 0.1
  # Penalty scale for scaffolds already crowding the corpus, applied as
  # weight * log2(entries sharing the scaffold). This is what stops the queue
  # collapsing onto a single chemical series.
  priority_scaffold_penalty: 3.0

coverage:
  enabled: true
  mode: hashed_fingerprint
  map_size_kib: 256
  occupancy_rotate_threshold: 0.55
  novelty_weights:
    strong: 2
    weak: 1
    none: 0

fuzzer:
  workers: 4
  # Checkpoint on whichever comes first: this many iterations, or this many
  # seconds. One iteration is a whole batch of docks, so on CPU the iteration
  # count alone can mean hours between checkpoints.
  checkpoint_every: 500
  checkpoint_every_seconds: 300
  log_level: INFO

ui:
  # Display mode: tui | quiet. null picks tui on a TTY and quiet otherwise.
  # Overridden by --ui.
  mode: null
