# Global defaults -- overridden per target
docking:
  exhaustiveness_fuzz: 4
  exhaustiveness_confirm: 16
  # CNN model for gnina's pose/affinity scoring pass. "fast" uses a single
  # lightweight model (~5x faster on CPU); null omits --cnn entirely, which
  # falls back to gnina's default full model ensemble (slower, most accurate).
  cnn_model_fuzz: fast
  cnn_model_confirm: null
  num_modes: 3
  engine: gnina

oracle:
  affinity_threshold: -9.0
  strain_threshold: 3.5
  selectivity_ratio_min: 2.0
  selectivity_policy: fail_open

molecules:
  max_mw: 550
  max_logp: 5.0
  max_rot_bonds: 10
  mutations_per_entry: 20

corpus:
  max_size: 50000
  priority_new_bit_weight: 10.0
  priority_affinity_weight: 1.0
  priority_reuse_penalty: 0.1

coverage:
  enabled: true
  mode: hashed_fingerprint
  map_size_kib: 256
  occupancy_rotate_threshold: 0.55
  novelty_weights:
    strong: 2
    weak: 1
    none: 0

fuzzer:
  workers: 4
  checkpoint_every: 500
  log_level: INFO
